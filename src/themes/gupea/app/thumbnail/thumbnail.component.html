<div class="thumbnail" [class.limit-width]="limitWidth">
  @if (isLoading()) {
    <div class="thumbnail-content outer">
      <div class="inner">
        <div class="centered">
          <ds-loading [spinner]="true"></ds-loading>
        </div>
      </div>
    </div>
  }
  <!-- Keep the image in the DOM so it can load while the spinner is visible. -->
  @if (src() !== null) {
    <img class="thumbnail-content img-fluid"
         [class.d-none]="isLoading()"
         [src]="src() | dsSafeUrl"
         [alt]="alt | translate"
         (error)="errorHandler()"
         (load)="successHandler()"/>
  }
</div>
