<div class="background-image-container mt-ncs">
  <div class="container">
    <div class="jumbotron jumbotron-fluid">
      <div class="d-flex flex-wrap">
        <div>
          <h1 class="display-3">GUPEA</h1>
	  <p class="lead">{{ 'home.gupea-full-name' | translate }}</p>
        </div>
      </div>
      <p>{{ 'home.gupea-description' | translate }}</p>
    </div>
  </div>
  <picture class="background-image">
    <source type="image/webp" srcset="assets/gupea/images/banner.webp 2000w, assets/gupea/images/banner-half.webp 1200w, assets/gupea/images/banner-tall.webp 768w">
    <source type="image/jpg" srcset="assets/gupea/images/banner.jpg 2000w, assets/gupea/images/banner-half.jpg 1200w, assets/gupea/images/banner-tall.jpg 768w">
    <img alt="" [src]="'assets/gupea/images/banner.jpg'"/><!-- without the []="''" Firefox downloads both the fallback and the resolved image -->
  </picture>
</div>
