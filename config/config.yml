rest:
  ssl: true
  host: sandbox.dspace.org
  port: 443
  nameSpace: /server

themes:
  - name: gupea
    extends: dspace
    prefetch: true
    headTags:
    - tagName: link
      attributes:
        rel: icon
        href: assets/gupea/images/favicons/favicon.ico
        sizes: any
    - tagName: link
      attributes:
        rel: icon
        href: assets/gupea/images/favicons/favicon.svg
        type: image/svg+xml
    - tagName: link
      attributes:
        rel: apple-touch-icon
        href: assets/gupea/images/favicons/apple-touch-icon.png
    - tagName: link
      attributes:
        rel: manifest
        href: assets/gupea/images/favicons/manifest.webmanifest

homePage:
  recentSubmissions:
    # Number of items shown in recent submissions
    pageSize: 5
    # Sort recent submissions by accession date
    sortField: 'dc.date.accessioned'
  topLevelCommunityList:
    # Communities per page; retain the target pagination controls
    # This will always round to the nearest number from the list of page sizes. e.g. if you set it to 7 it'll use 10
    pageSize: 20
  # Enable or disable the Discover filters on the homepage
  showDiscoverFilters: false

languages:
  - code: en
    label: English
    active: true
  - code: sv
    label: Svenska
    active: true

info:
  enableCookieConsentPopup: false
  enablePrivacyStatement: false
  enableEndUserAgreement: false
